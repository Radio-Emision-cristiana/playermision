<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .banner-container {
            background: linear-gradient(to right, #ffffff, #d4e7f5, #b8d9f0);
            border-radius: 0;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 1200px;
            margin: 0 auto;
            gap: 20px;
        }

        .logo-section {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .logo-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #003366;
            background-color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .logo-icon {
            font-size: 40px;
            margin-bottom: 5px;
        }

        .logo-text {
            font-size: 10px;
            color: #003366;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
        }

        .message-section {
            flex: 1;
            text-align: center;
            padding: 0 20px;
        }

        .message-title {
            color: #003366;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .message-subtitle {
            color: #003366;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .handshake-icon {
            font-size: 40px;
            color: #666;
        }

        .payment-section {
            display: flex;
            gap: 15px;
            flex-shrink: 0;
        }

        .payment-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .payment-logo {
            background-color: white;
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .payment-logo img {
            display: block;
            height: 45px;
            width: auto;
        }

        .payment-text {
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }

        .donate-button {
            padding: 8px 25px;
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .donate-button:hover {
            transform: scale(1.05);
        }

        .button-red {
            background-color: #e74c3c;
        }

        .button-green {
            background-color: #27ae60;
        }

        .button-blue {
            background-color: #3498db;
        }

        .footer-info {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #333;
        }

        .contact-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 5px;
        }

        .phone-number {
            font-weight: bold;
            color: #003366;
        }

        .contact-icon {
            width: 25px;
            height: 25px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .contact-icon:hover {
            transform: scale(1.1);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .banner-container {
                flex-wrap: wrap;
                justify-content: center;
            }

            .payment-section {
                width: 100%;
                justify-content: center;
                margin-top: 20px;
            }
        }

        @media (max-width: 768px) {
            .payment-section {
                flex-direction: column;
                gap: 10px;
            }

            .banner-container {
                padding: 15px;
            }

            .message-title {
                font-size: 18px;
            }

            .message-subtitle {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <img src="https://i.postimg.cc/7LpXxjcH/RADIO_(3).png" alt="Logo" class="main-logo">
        </div>

        <!-- Message Section -->
        <div class="message-section">
            <div class="message-title">Si deseas bendecir el ministerio, con tu apoyo bendecimos a más vidas</div>
            <div class="message-subtitle"></div>
            <div class="handshake-icon">🤝</div>
        </div>

        <!-- Payment Options Section -->
        <div class="payment-section">
            <!-- PayPal -->
            <div class="payment-option">
                <div class="payment-logo">
                    <img src="https://i.postimg.cc/NGmZwjK4/paypal.png" alt="PayPal">
                </div>
                <button class="donate-button button-red" onclick="donarPayPal()">DONAR</button>
            </div>

            <!-- Banreservas -->
            <div class="payment-option">
                <div class="payment-logo">
                    <img src="https://i.postimg.cc/7YpCJXHr/banreservas.png" alt="Banreservas">
                </div>
                <button class="donate-button button-green" onclick="donarBanreservas()">DONAR</button>
            </div>

            <!-- Banco Popular -->
            <div class="payment-option">
                <div class="payment-logo">
                    <img src="https://i.postimg.cc/9MnX5Fzz/popular.png" alt="Banco Popular">
                </div>
                <button class="donate-button button-blue" onclick="donarPopular()">DONAR</button>
            </div>
        </div>
    </div>

    <!-- Footer Info -->
    <div class="footer-info">
        <div>OFRENDA BOLUNTARIA NO OBLIGATORIA</div>
        <div class="contact-info">
            <span class="phone-number">(849-403-3515)</span>
            <svg class="contact-icon" onclick="llamar()" viewBox="0 0 24 24" fill="#003366">
                <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
            </svg>
            <svg class="contact-icon" onclick="whatsapp()" viewBox="0 0 24 24" fill="#25D366">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
            </svg>
        </div>
    </div>

    <script>
        // Funciones para personalizar - CAMBIA ESTOS ENLACES
        function donarPayPal() {
            // Cambia este enlace por tu enlace de PayPal
            window.open('https://www.paypal.com/tu-enlace-de-donacion', '_blank');
        }

        function donarBanreservas() {
            // Puedes mostrar un modal con los datos de la cuenta o redirigir
            alert('Cuenta Banreservas:\nNúmero de cuenta: 123456789\nA nombre de: Tu Fundación');
        }

        function donarPopular() {
            // Puedes mostrar un modal con los datos de la cuenta o redirigir
            alert('Cuenta Banco Popular:\nNúmero de cuenta: 987654321\nA nombre de: Tu Fundación');
        }

        function llamar() {
            // Cambia el número de teléfono
            window.location.href = 'tel:+18494033515';
        }

        function whatsapp() {
            // Cambia el número de teléfono (formato internacional sin +)
            window.open('https://wa.me/18494033515?text=Hola, deseo información sobre donaciones', '_blank');
        }
    </script>
</body>
</html>
